name: Wekelijkse beschikbaarheidscontrole
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: ${{ vars.PRODUCTION_URL }}
      HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
    steps:
      - name: Controleer site en database
        shell: bash
        run: |
          if [[ "$SITE_URL" != https://* || -z "$HEALTH_TOKEN" ]]; then
            echo "::error::Configureer PRODUCTION_URL en HEALTH_TOKEN."
            exit 1
          fi

          base="${SITE_URL%/}"
          check() {
            local code
            if code="$(curl --silent --show-error --proto '=https' --max-time 25 --output /dev/null --write-out '%{http_code}' "$@")"; then
              printf '%s' "$code"
            else
              printf 'onbereikbaar'
            fi
          }
          site="$(check "$base/")"
          health="$(check --header "Authorization: Bearer $HEALTH_TOKEN" "$base/api/health")"
          echo "Keep-alive: website $site, Supabase-health $health"
          [[ "$site" == 200 && "$health" == 200 ]]
